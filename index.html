<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마스크 판별기</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        h1 { color: #333; }
        #webcam-container { margin: 20px auto; border: 5px solid #ddd; border-radius: 10px; width: fit-content; overflow: hidden; }
        #label-container { font-size: 24px; font-weight: bold; margin-top: 20px; color: #007bff; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>AI 마스크 착용 판별 시스템</h1>
    <p>지리 수업 AI 융합 실습</p>
    <button type="button" onclick="init()">카메라 시작하기</button>
    
    <div id="webcam-container"></div>
    <div id="label-container">결과 대기 중...</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // 선생님이 발급받은 티쳐블 머신 모델 링크를 여기에 넣으세요!
        const URL = "https://teachablemachine.withgoogle.com/models/XGHm5A7ou/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 모델 로드
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 웹캠 설정
            const flip = true; 
            webcam = new tmImage.Webcam(400, 400, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 웹캠 화면을 화면에 추가
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // 확률이 가장 높은 클래스를 찾아서 표시
            let bestPrediction = "";
            let highestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestPrediction = prediction[i].className === "Mask_On" ? "🟢 마스크 착용 확인" : "🔴 마스크 미착용";
                }
            }
            labelContainer.innerHTML = bestPrediction + " (" + (highestProb * 100).toFixed(0) + "%)";
        }
    </script>
</body>

</html>
